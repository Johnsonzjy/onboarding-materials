<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }} · 管理后台{% endblock %}</title>
<style>
  /* ===== SaaS 后台框架：左侧深色导航 + 右侧浅色内容区 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         height: 100vh; display: flex; background: #f3f5f9; }
  /* 侧边栏 */
  aside { width: 216px; background: #1f2d4d; color: #c8d2e8;
          display: flex; flex-direction: column; flex-shrink: 0; }
  .brand { padding: 20px 18px; font-size: 15px; font-weight: 600; color: #fff;
           border-bottom: 1px solid rgba(255,255,255,0.08); }
  .brand .emoji { margin-right: 8px; }
  nav { flex: 1; padding: 14px 10px; }
  nav a {
    display: block; padding: 10px 14px; margin-bottom: 4px; border-radius: 8px;
    color: #c8d2e8; text-decoration: none; font-size: 14px;
  }
  nav a:hover { background: rgba(255,255,255,0.08); }
  nav a.active { background: #2f6bff; color: #fff; font-weight: 600; }
  .side-foot { padding: 14px 18px; font-size: 12px; color: #7e8db0;
               border-top: 1px solid rgba(255,255,255,0.08); }
  .side-foot a { color: #c8d2e8; text-decoration: none; cursor: pointer; }
  /* 内容区 */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: #fff; border-bottom: 1px solid #e5e8ef;
            padding: 14px 26px; font-size: 17px; font-weight: 600; color: #1f2d4d; }
  .content { flex: 1; overflow-y: auto; padding: 24px 26px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
  <aside>
    <div class="brand"><span class="emoji">📋</span>入职制度问答<br><span style="font-size:11px;font-weight:400;color:#7e8db0">管理后台</span></div>
    <nav>
      <!-- active 由路由上下文注入，实现当前页高亮 -->
      <a href="/admin" class="{{ 'active' if active == 'dashboard' }}">📊 仪表盘</a>
      <a href="/admin/knowledge" class="{{ 'active' if active == 'knowledge' }}">📚 制度知识库</a>
      <a href="/admin/prompts" class="{{ 'active' if active == 'prompts' }}">✏️ 提示词模板</a>
      <a href="/admin/audit" class="{{ 'active' if active == 'audit' }}">🛡️ 对话审计</a>
      <a href="/" style="margin-top:16px;">💬 返回问答界面</a>
    </nav>
    <div class="side-foot">
      {{ user.name }}（管理员）<br>
      <a id="logout">退出登录</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">{{ title }}</div>
    <div class="content">{% block content %}{% endblock %}</div>
  </div>

<script>
/* 退出登录：清 Cookie + 本地令牌，回登录页 */
document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST" });
  localStorage.removeItem("chat_token");
  location.href = "/login";
});
{% block script %}{% endblock %}
</script>
</body>
</html>
