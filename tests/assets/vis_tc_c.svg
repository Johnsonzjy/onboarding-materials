    <text x="160" y="325" text-anchor="middle" font-size="12" fill="#6b5a95">C-07~10</text>
    <rect x="260" y="270" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="355" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 允许</text>
    <rect x="450" y="270" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="545" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 仅本人</text>
    <rect x="640" y="270" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="735" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 302→/login</text>
    <rect x="830" y="270" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="925" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1005</text>
    <rect x="1020" y="270" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1115" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1005</text>
    <rect x="1210" y="270" width="230" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1325" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 空结果</text>
  </g>

  <!-- 行：admin -->
  <g>
    <rect x="60" y="340" width="200" height="70" fill="#efe7f8" stroke="#b39ddb"/>
    <text x="160" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c3380">admin</text>
    <text x="160" y="395" text-anchor="middle" font-size="12" fill="#6b5a95">C-11~13</text>
    <rect x="260" y="340" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="355" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 允许</text>
    <rect x="450" y="340" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="545" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 允许</text>
    <rect x="640" y="340" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="735" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 允许</text>
    <rect x="830" y="340" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="925" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 允许</text>
    <rect x="1020" y="340" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="1115" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 允许</text>
    <rect x="1210" y="340" width="230" height="70" fill="#fff3cd" stroke="#e08c00"/><text x="1325" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c6f1b">仅本租户</text>
  </g>

  <!-- 行：tenant-b -->
  <g>
    <rect x="60" y="410" width="200" height="70" fill="#efe7f8" stroke="#b39ddb"/>
    <text x="160" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c3380">tenant-b 账号</text>
    <text x="160" y="465" text-anchor="middle" font-size="12" fill="#6b5a95">C-14~17</text>
    <rect x="260" y="410" width="190" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="355" y="453" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e6b3a">√ 本租户</text>
    <rect x="450" y="410" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="545" y="453" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 空/1005</text>
    <rect x="640" y="410" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="735" y="453" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1005</text>
    <rect x="830" y="410" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="925" y="453" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1005</text>
    <rect x="1020" y="410" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1115" y="453" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 空/1005</text>
    <rect x="1210" y="410" width="230" height="70" fill="#e6f4ea" stroke="#1e6b3a"/><text x="1325" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e6b3a">√ 仅 tenant-b</text>
  </g>

