    <text x="925" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">/api/admin/*</text>

    <rect x="1020" y="130" width="190" height="70" fill="#5d4391"/>
    <text x="1115" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">审计导出</text>
    <text x="1115" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">四要素只读</text>

    <rect x="1210" y="130" width="230" height="70" fill="#5d4391"/>
    <text x="1325" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">他租户数据</text>
    <text x="1325" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">tenant-b 视角</text>
