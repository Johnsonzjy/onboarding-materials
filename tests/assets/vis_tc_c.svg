    <text x="160" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">（行=角色，列=资源）</text>

    <rect x="260" y="130" width="190" height="70" fill="#5d4391"/>
    <text x="355" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">聊天问答 API</text>
    <text x="355" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">/api/chat</text>

    <rect x="450" y="130" width="190" height="70" fill="#5d4391"/>
    <text x="545" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">清单 / 材料</text>
    <text x="545" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">本人数据</text>

    <rect x="640" y="130" width="190" height="70" fill="#5d4391"/>
    <text x="735" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">管理后台页面</text>
    <text x="735" y="184" text-anchor="middle" font-size="12" fill="#d9ccef">/admin/*</text>

    <rect x="830" y="130" width="190" height="70" fill="#5d4391"/>
