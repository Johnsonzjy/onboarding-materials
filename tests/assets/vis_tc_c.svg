    <rect x="60" y="480" width="200" height="70" fill="#efe7f8" stroke="#b39ddb"/>
    <text x="160" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c3380">停用账号</text>
    <text x="160" y="535" text-anchor="middle" font-size="12" fill="#6b5a95">C-18</text>
    <rect x="260" y="480" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="355" y="523" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 拒绝</text>
    <rect x="450" y="480" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="545" y="523" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 拒绝</text>
    <rect x="640" y="480" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="735" y="523" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 拒绝</text>
    <rect x="830" y="480" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="925" y="523" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 拒绝</text>
    <rect x="1020" y="480" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1115" y="523" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 拒绝</text>
    <rect x="1210" y="480" width="230" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1325" y="523" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 拒绝</text>
  </g>

  <!-- 底部专项 -->
  <rect x="60" y="590" width="660" height="220" rx="10" fill="#f7f4fd" stroke="#7c5cbf" stroke-width="2"/>
  <text x="390" y="630" text-anchor="middle" font-size="19" font-weight="bold" fill="#4c3380">会话与时序专项（C-04~06 / C-19 / C-20）</text>
  <text x="90" y="668" font-size="15" fill="#5d4391">token 过期边界 ±60s 正确判定 · 签名/格式错误返回 1004</text>
  <text x="90" y="702" font-size="15" fill="#5d4391">admin 降级 employee：旧 token 下管理接口立即 1005</text>
  <text x="90" y="736" font-size="15" fill="#5d4391">Cookie 与 Bearer 双通道鉴权结论 100% 一致</text>
  <text x="90" y="770" font-size="15" fill="#5d4391">登出后旧 Cookie 立即失效，访问返回 1004</text>

  <rect x="760" y="590" width="680" height="220" rx="10" fill="#fdecea" stroke="#c53030" stroke-width="2.5"/>
  <text x="1100" y="630" text-anchor="middle" font-size="19" font-weight="bold" fill="#a52828">量化出口</text>
  <text x="790" y="668" font-size="15" fill="#8a3232">20 例 100% 通过 · 跨租户数据 0 泄漏</text>
  <text x="790" y="702" font-size="15" fill="#8a3232">每次拒绝均落审计日志（谁在何时访问了什么被拒）</text>
  <text x="790" y="736" font-size="15" fill="#8a3232">鉴权接口响应 P95 &lt; 200ms（中间件开销可忽略）</text>
  <text x="790" y="770" font-size="15" fill="#8a3232">越权尝试全部可在审计页按 user_id 检索还原</text>
</svg>
