    <text x="160" y="255" text-anchor="middle" font-size="12" fill="#6b5a95">C-01~03</text>
    <rect x="260" y="200" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="355" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1004</text>
    <rect x="450" y="200" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="545" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1004</text>
    <rect x="640" y="200" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="735" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 302→/login</text>
    <rect x="830" y="200" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="925" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1004</text>
    <rect x="1020" y="200" width="190" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1115" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1004</text>
    <rect x="1210" y="200" width="230" height="70" fill="#fdeaea" stroke="#d64545"/><text x="1325" y="243" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">× 1004</text>
  </g>

  <!-- 行：employee -->
