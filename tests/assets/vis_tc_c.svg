<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="SimHei">
  <rect width="1500" height="860" fill="#ffffff"/>
  <rect x="0" y="0" width="1500" height="90" fill="#4c3380"/>
  <text x="750" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">TC-C 权限场景 · 角色资源访问矩阵（20 条用例，100% 隔离）</text>

  <!-- 矩阵 -->
  <g>
